[project]
name = "foursight-tools"
version = "0.1.0"
description = "Offline tooling: ROS 2 mcap bags -> 4sight ride footage"
requires-python = ">=3.10"
dependencies = [
    "mcap>=1.2",
    "mcap-ros2-support>=0.5",
    "opencv-python>=4.9",
    "numpy>=1.26,<2.3",
    "folium>=0.20.0",
    "pandas>=2.3.3",
    "requests>=2.34.2",
]

[tool.uv]
package = false
