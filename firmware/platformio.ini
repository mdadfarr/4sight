[platformio]
; One source file for both tools: Arduino IDE opens foursight/foursight.ino directly.
src_dir = foursight
default_envs = esp32dev

; Arduino-ESP32 core 2.x (PlatformIO default)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.1.0

; Arduino-ESP32 core 3.x, as in the newest Arduino IDE board package: pio run -e esp32dev-core3
[env:esp32dev-core3]
extends = env:esp32dev
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
